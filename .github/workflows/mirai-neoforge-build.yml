name: Mirai NeoForge Build

on:
  push:
    branches: [mirai-1.21.1-neoforge-dev, mirai-1.21.1-neoforge-production]
  pull_request:
    branches: [mirai-1.21.1-neoforge-dev, mirai-1.21.1-neoforge-production]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  neoforge-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build NeoForge artifact
        run: |
          chmod +x gradlew
          ./gradlew :bootstrap:neoforgeJar --no-daemon --stacktrace
      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiraiArclight-NeoForge-1.21.1
          path: bootstrap/build/libs/arclight-neoforge-1.21.1-*.jar
          if-no-files-found: error
